# Every quoted number, and the artefact it is recomputed from.
#
# `make claims` reads this file, recomputes each `expr` over the named artefact, formats it, and
# fails unless the result is exactly the `quoted` string AND that string still appears in every
# document listed. Then it does the harder half: inside every `region`, any number that is not a
# claim or an allowed constant is a failure, so the registry cannot fall behind the prose.
#
# Adding a number to a covered section means adding it here. That is the intended cost: this
# repository has already shipped an evasion curve that three documents kept quoting after the
# artefact behind it had been regenerated.
#
# Grammar of `expr` is in `afl/repro/claims.py` — a small set of named reductions, evaluated with
# no builtins, that can only read the artefact named on the same line.

version: 1

artifacts:
  abcd: artifacts/abcd/amlworld_gather-scatter.json
  abcd_binding: artifacts/abcd/diagnostics/amlworld_gather-scatter_binding.json
  ts_paysim: artifacts/three_system/paysim.json
  ts_amlsim: artifacts/three_system/amlsim.json

# Sections whose every number must trace to a claim below. These are the four places the
# headline result is stated; `docs/reproducibility.md` records what is not yet covered and why.
regions:
  - file: README.md
    section: "# Adaptive Fraud Simulation Lab"
    until: "## How it fits together"
  - file: README.md
    section: "## Main result"
  - file: docs/results.md
    section: "## The A/B/C/D experiment"
  - file: docs/claim.md
    section: "### 4. When they do pass, does adaptive beat non-adaptive?"
  - file: docs/submission.md
    section: "## Four questions, four answers"
  - file: docs/submission.md
    section: "## The result, in one table"

# Numbers in a covered section that are not measurements. Each needs a reason, because "it is
# obviously not a result" is exactly what was said about several numbers that were.
allow:
  "0.05": "the significance convention the result is judged against, not a measurement"
  "0": "the loop's first round is round 0"
  "1": "row numbers in the four-question table"
  "2026": "the year of the challenge this was built for"
  "12": "ticket number (12 = A/B/C/D), and the episodes-per-round budget stated in the artefact header"
  "16": "ticket number (16 = the three-system table)"
  "20": "ticket number (20 = reproducibility)"
  "11": "ticket number (11 = the leave-one-attack-out harness)"
  "0005": "ADR number in a filename"
  "1.0": "the retired artefact's version label, not a metric"
  "2": "the '2-seed reading' that was retracted, and the two experiments being set side by side"
  "4": "the four public anchors tried, and the 4.5x factor spelled out below it"
  "18": "leave-one-attack-out folds, quoted from docs/loao.md rather than from this artefact"
  "5": "the '4.5x reduction' decimal half, and 'five acts' of the prototype"

claims:
  # ── the fold itself ─────────────────────────────────────────────────────────
  - id: abcd.seeds
    what: seeds in the A/B/C/D run
    artifact: abcd
    expr: n_seeds()
    quoted: "7"
    docs: [README.md, docs/results.md, docs/claim.md]
  - id: abcd.rounds
    what: loop rounds per seed
    artifact: abcd
    expr: at('rounds')
    quoted: "6"
    docs: [README.md, docs/results.md, docs/claim.md]
  - id: abcd.positives
    what: positives in the held-out GATHER-SCATTER fold
    artifact: abcd
    expr: at('runs.0.positives')
    quoted: "173"
    docs: [README.md, docs/results.md]
  - id: abcd.base_rate
    what: base rate of the held-out fold
    artifact: abcd
    expr: at('runs.0.base_rate')
    fmt: "{:.3%}"
    quoted: "0.053%"
    docs: [README.md, docs/results.md]
  - id: abcd.fixed_fpr
    what: the operating point the recall column is read at
    artifact: abcd
    expr: at('operating_point.fixed_fpr')
    fmt: "{:.0%}"
    quoted: "1%"
    docs: [README.md, docs/results.md, docs/claim.md]
  - id: abcd.split_digest
    what: committed out-of-time split the fold was cut on
    artifact: abcd
    expr: at('split_digest')
    quoted: "f5e33a878d68b792"
    docs: [README.md, docs/results.md]
  - id: abcd.git_commit
    what: the commit the canonical artefact was produced on
    artifact: abcd
    expr: at('git_commit')[:8]
    quoted: "4050fc46"
    docs: [README.md, docs/results.md, docs/claim.md]
  - id: abcd.git_dirty
    what: whether that tree was dirty
    artifact: abcd
    expr: "'true' if at('git_dirty') else 'false'"
    quoted: "false"
    docs: [README.md, docs/claim.md]

