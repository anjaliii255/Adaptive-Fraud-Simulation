  # ── the same counts as a document phrases them in prose ────────────────────
  # Registered separately from the `N/7` forms above: the checker masks a phrase before it
  # tokenises, so `D wins 1 of 7 seeds` is verified as a claim rather than passing as two
  # unrelated digits.
  # ── the gate, on the anchors it fires on ────────────────────────────────────
  # Three documents said the strict `lift` rule "rejects 100% of candidate batches" on these two
  # anchors. What the artefacts record is the batch the loop kept, round by round, and on AMLSim
  # one round of thirty-six survives the rule. Registered so the sentence cannot drift back.
  - id: ts.amlsim.lift_rejects
    what: rounds on AMLSim whose kept batch the strict `lift` rule would have rejected
    artifact: ts_amlsim
    expr: (loop_rounds('rejected_by_lift'), loop_total())
    fmt: "{} of {}"
    quoted: "35 of 36"
    docs: [docs/submission.md]
  - id: ts.paysim.lift_rejects
