# A's mule-graph anchor: real layering topology for the graph engine to imitate, and typology
# labels that define a held-out VARIANT inside the S1 mule family.
# Every column below was verified against the real file; nothing here is a guess.

name: amlsim
loader: amlsim
kind: real                     # real rows carry NO provenance (vector_id=None)
is_pipeline_check: false

source:
  url: https://www.kaggle.com/datasets/anshankul/ibm-amlsim-example-dataset
  generator: https://github.com/IBM/AMLSim
  transactions_file: transactions.csv
  alerts_file: alerts.csv      # carries ALERT_TYPE; the typology join, not accounts.csv
  accounts_file: accounts.csv  # account metadata; not needed for the typology join
  place_in: data/raw/IBMAml/   # verified: this is the directory the dump actually lands in
  download: manual
  license: "see AMLSim repo / Kaggle page"

# --- dataset column -> contract Transaction field (verified against header row) ---
schema_map:
  txn_id: TX_ID
  ts: TIMESTAMP
  src: SENDER_ACCOUNT_ID
  dst: RECEIVER_ACCOUNT_ID
  amount: TX_AMOUNT
  rail: __const__:a2a          # bank-to-bank transfers; constant rail
  is_fraud: IS_FRAUD

extra_columns:
  TX_TYPE: tx_type             # kept for analysis; never a raw feature

time:
  column: TIMESTAMP
  unit: days                   # verified: integer steps 0..199, not a timestamp string
  epoch: "2023-01-01T00:00:00"

fraud:
  positive_label: true         # IS_FRAUD is the string True/False, not 1/0
  # ALERT_TYPE is NOT in transactions.csv. Join alerts.csv on ALERT_ID to recover the typology.
  typology_column: ALERT_TYPE
  typology_join:
    left: ALERT_ID             # transactions.csv
    right: ALERT_ID            # alerts.csv
  typologies_present: [fan_in, cycle]   # verified: only these two exist in this dump

# --- held-out VARIANT design for S1 ---
# Strong vectors use leave-one-VARIANT-out: train the mule family on one topology, hold another
# out entirely, and measure S1 recall on the unseen shape. Collapsed to what the dump contains.
holdout_variants:
  train_on: [fan_in]           # 783 alerts
  hold_out: [cycle]            # 936 alerts, never in training: the "unseen mule shape"

leakage:
  identifier_columns: [SENDER_ACCOUNT_ID, RECEIVER_ACCOUNT_ID]  # graph features, not raw features
  drop_columns: [ALERT_ID]     # an alert id is a label path; drop from X after the typology join

# --- realism envelope: stats A's graph engine and realism.py derive bounds from ---
# The point of a real AML graph is to imitate its shape, not copy its rows.
envelope:
  extract:
    - fan_in_degree_distribution
    - fan_out_degree_distribution
    - amount_distribution_per_typology
    - inter_transaction_time_distribution
    - path_length_distribution           # layering chain depth
  commit_to: artifacts/envelopes/amlsim_envelope.json

split:
  strategy: out_of_time
  time_column: TIMESTAMP
  train_end_step: 133          # steps 0..133 -> train (~67% of the 0..199 range)
  embargo_steps: 1             # step 134 dropped; >= the widest graph-feature lookback
  test_start_step: 135         # steps 135..199 -> test
  random: false
  commit_to: artifacts/splits/amlsim_oot.json
  embargo_rationale: >
    Steps are days and graph features look back one window, so a one-day gap stops a layering
    chain being half-trained-on and half-tested-on.

data_card:
  accounts: ~10000
  rows: 1323234                # verified
  sar_base_rate: 0.0012998     # verified: 1719 / 1323234
  time_span: "200 daily steps"
  quirks:
    - "Synthetic (multi-agent AML simulator): a stand-in for real AML graphs, not real data."
    - "Only two typologies present (fan_in, cycle), not the seven AMLSim can generate."
    - "IS_FRAUD is a string True/False in both transactions.csv and accounts.csv."
    - "Transaction-level and account-level fraud labels both exist; use transaction-level."
  cannot_tell_us:
    - "Nothing about card or UPI behavioural fraud; that is PaySim's job and the injected vectors'."
    - "Base rate 0.13% matches PaySim, and both sit ~130x below the synthetic default."
