# B's behavioural anchor: baseline detector, features, evaluation, three-system table.
# Every number and column name below was verified against the file on disk.

name: paysim
loader: paysim
kind: real                     # real rows carry NO provenance (vector_id=None); loader enforces
is_pipeline_check: false       # a real anchor, so numbers from this config are reportable

purpose: >
  Mobile-money account-to-account traffic with a labelled account-drain arc. This is the
  behavioural anchor: the velocity and drift engines imitate its pacing, and every headline
  detector number is measured on it.

source:
  url: https://www.kaggle.com/datasets/ealaxi/paysim1
  file: PS_20174392719_1491204439457_log.csv
  place_in: data/raw/          # verified: csv sits directly in data/raw/, no subdirectory
  download: manual             # kaggle; not committed (data/** is gitignored)
  license: "CC BY-SA 4.0"

# --- dataset column -> contract Transaction field ---
schema_map:
  txn_id: __row_index__        # PaySim has no txn id; loader synthesises a stable "paysim-{i}"
  ts: step                     # integer hour, converted to datetime via `time.epoch`
  src: nameOrig
  dst: nameDest
  amount: amount
  rail: __const__:a2a          # mobile-money A2A; constant rail (contract Rail enum)
  is_fraud: isFraud

time:
  column: step
  unit: hours                  # verified: steps run 1..743, so 1 step = 1 hour over ~31 days
  epoch: "2023-01-01T00:00:00" # fixed anchor so step -> timestamp is deterministic

fraud:
  positive_label: 1
  # verified: all 8213 fraud rows are TRANSFER (4097) or CASH_OUT (4116)
  occurs_only_in: [TRANSFER, CASH_OUT]
  note: >
    Other types (CASH_IN, DEBIT, PAYMENT) are always legit. Keep them: they are the legitimate
    background the detector learns "normal" against.

# --- leak handling: the part that keeps the detector honest ---
# The loader reads only the columns in schema_map, so none of the below ever reaches a contract
# row. That is the enforcement; this block is the record of why.
leakage:
  drop_columns:
    - isFlaggedFraud           # naive >200k rule proxy, not ground truth. Pure label leak.

  identifier_columns:          # build graph/velocity features FROM these; never raw features
    - nameOrig
    - nameDest                 # 'C...' customer, 'M...' merchant (PAYMENT only)

  balance_columns:
    - oldbalanceOrg
    - newbalanceOrig
    - oldbalanceDest
    - newbalanceDest
  # Fraud empties the account, so amount == oldbalanceOrg and newbalanceOrig == 0 for most fraud.
  # A generation artifact that does not transfer to real data: including it lets the model win on
  # arithmetic instead of behaviour. Alternative `error_features` derives
  # errorBalanceOrig = newbalanceOrig + amount - oldbalanceOrg and drops the raw four.
  balance_policy: exclude      # exclude | error_features

keep_types: all                # every txn type is background; do NOT filter to fraud types only

# --- run-time sampling ---
# Full PaySim is ~7.7 GB once it is contract rows, so the default run reads a deterministic
# hash-sample of BENEFICIARIES. nameDest is the sampling key because it is the only entity in
# PaySim with a history worth preserving (see the quirk below). Whole entities are kept or
# dropped, never individual rows: an entity with half its rows removed has a velocity profile no
# production scorer would ever see. Measured effect is in docs/data-cards/paysim.md.
sample:
  sample_fraction: 0.10        # ~636k rows; 1.0 reads all 6.36M
  sample_by: nameDest

# --- out-of-time split: computed once, committed, reused ---
# train_end_step and test_start_step are NOT here on purpose. They are derived from train_frac
# by scripts/build_splits.py and committed to the artefact below, so the boundary has one home.
split:
  strategy: out_of_time
  time_column: step
  train_frac: 0.70             # of ROWS, not of steps -- see the traffic-skew quirk below
  embargo_steps: 24            # 24 hourly steps dropped between train and test
  random: false                # NEVER random
  commit_to: artifacts/splits/paysim_oot.json
  embargo_rationale: >
    Velocity features look back up to 24h. A 24-step embargo stops a test row's features being
    computed over train-side rows, and stops a fraud ring straddling the boundary.

data_card:
  rows: 6362620                # verified
  fraud_base_rate: 0.0012908   # verified: 8213 / 6362620
  time_span: "743 hourly steps (~31 days)"
  quirks:
    - "nameOrig is effectively unique per row: 6,353,307 distinct origins over 6,362,620 rows
       (mean 1.001 txns each, max 3). There is NO sender history in PaySim. Every src-side
       velocity, RFM and recency feature is structurally empty on this anchor; the only entity
       with a past is nameDest (mean 2.34 txns, max 113). Ticket 07's feature set has to be
       built on the beneficiary side or it is building on nothing."
    - "Traffic is violently non-uniform across steps: 341 of the 743 steps carry under 100 rows,
       while step 19 alone carries 51,352. Cutting the split at 67% of the STEPS puts 95.3% of
       the rows in train and leaves a 4% test tail, so the boundary is derived from the row
       quantile instead."
    - "Fraud only in TRANSFER / CASH_OUT."
    - "Balance columns are a generation artifact (leak); see balance_policy."
    - "isFlaggedFraud fires on 16 rows out of 6.36M. It is a naive rule, not ground truth."
    - "16 rows carry amount == 0, which the contract rejects. The loader clamps them to 0.01 and
       logs the count; dropping them instead would move the base rate in silence."
    - "No self-transfers (src == dst) anywhere in the file."
  cannot_tell_us:
    - "Nothing about card rails, UPI or agentic commerce; those enter only via injected vectors."
    - "No merchant category, no geo, no device. Device features are unmeasurable on this anchor."
    - "Base rate 0.129% is ~130x below the synthetic default, so operating points set on
       synthetic traffic do not carry over. See docs/adr/0002-dataset-anchors.md."
