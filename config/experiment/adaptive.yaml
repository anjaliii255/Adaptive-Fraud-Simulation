# @package _global_
# System C — the adaptive loop. The hero run.
#
# attack -> detect -> log evasions -> mutate -> retrain -> eval, held-out family never generated.

experiment:
  name: adaptive
  system: adaptive
  rounds: 12
  augment: adaptive
  compare: true          # emit the 3-system table from this run
  smote_ratio: 1.0

attack:
  optimiser:
    rounds: 12
    lambda_realism: 0.5

defend:
  supervised:
    # every row explained, not just the flagged ones: the demo shows reason codes beside
    # allowed traffic too, so an analyst can see what a quiet transaction looked like
    explain: always
