# The workhorse. Every headline number is measured against this; the exotic layers have to
# beat it on the same split before they earn a row in the table. Which only means anything if
# this one is tuned honestly — a soft baseline makes every later result meaningless.
#
# This file holds the INPUTS: the starting params and the envelope the search may move inside.
# The DECISION — the params the search landed on for an anchor — is committed to
# artifacts/detector/<anchor>.json by `make baseline`, next to the numbers it produced. Same
# division as the committed split: config that carried the tuned params would drift from the run
# that justified them the moment either was edited alone.

kind: lgbm
replay_weight: 3.0     # evasions are the expensive examples; see afl/defend/models/lgbm.py

# flagged | always. Reason codes on a FLAGGED row are not optional — a transaction that got an
# action and no explanation is what ticket 09 removed — so this only decides whether the allowed
# rows are explained too. `flagged` is what makes it affordable: SHAP runs on the rows carrying
# an action, well under 1% of a batch, instead of on all of them.
explain: flagged

# Read the committed tuned params for this run's anchor when there are any. false pins the run
# to the starting params below, which is how the "did tuning help" column is produced.
use_committed_params: true

params:
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  n_estimators: 300
  subsample: 0.9
  subsample_freq: 1    # LightGBM ignores `subsample` at the default freq of 0; without this the
                       # row-sampling fraction above is an inert knob
  colsample_bytree: 0.8
  reg_lambda: 0.0
  class_weight: null   # null | balanced — searched, not assumed; see the envelope below

# The honest-tuning contract. The search only ever sees a validation tail of the TRAINING
# window: afl/defend/tuning.py raises if the validation rows are not strictly after the fitting
# rows, because a search that touches the test window produces a number that looks like skill.
tuning:
  enabled: true
  n_trials: 40
  backend: auto        # optuna | random | auto — the random path is exercised in CI
  metric: pr_auc       # pr_auc | recall_at_fixed_fpr; measured at eval.fixed_fpr
  fit_frac: 0.8        # of the training window; the remaining tail is the tuning validation set

  # Deliberately wide. A search space hugging the defaults makes the search a formality and
  # leaves the baseline soft, which is the one failure this ticket exists to avoid.
  search_space:
    learning_rate:     {type: float, low: 0.01, high: 0.3, log: true}
    num_leaves:        {type: int,   low: 15,   high: 255, log: true}
    min_child_samples: {type: int,   low: 5,    high: 300, log: true}
    n_estimators:      {type: int,   low: 100,  high: 900, step: 100}
    subsample:         {type: float, low: 0.5,  high: 1.0}
    colsample_bytree:  {type: float, low: 0.4,  high: 1.0}
    reg_lambda:        {type: float, low: 0.001, high: 50.0, log: true}
    class_weight:      {type: categorical, choices: [null, balanced]}

features:
  stateful: true       # a mule's history does not reset because a new round began
  windows_s: [3600, 86400, 604800]

# Score -> action. The costs themselves live in config/costs/default.yaml, because what a
# decline costs is a business input shared by every detector in the run, not a property of the
# gradient-boosted trees.
decision:
  # cost | threshold. `cost` prices all five actions at THIS transaction's amount and takes the
  # cheapest, so the bands are an output of config/costs/default.yaml rather than four numbers
  # typed in here. `threshold` compares against derived band edges, for a detector with no
  # amount to hand.
  #
  # The bands used to be hand-set: `calibrate_to_fpr` put decline_at at the target FPR and the
  # other three sat at 0.8, 0.6 and 0.3 of it — ratios calibrated to nothing. On the PaySim M3
  # fold that landed friction on 45.6% of holdout traffic while precision@100 was 0.00. There
  # are no band numbers in this file any more; there is nowhere left to type one.
  mode: cost

  # sigmoid | isotonic | none. `p x amount` against a flat analyst cost is arithmetic on a
  # probability, and a boosted tree's predict_proba is a ranking score. Platt scaling on the
  # tuning validation tail makes it one. Isotonic is available and is not the default because
  # that tail carries 46 fraud rows on PaySim — two parameters are what survives it.
  #
  # `none` is a foot-gun and the number is measured: the same synthetic loop puts friction on
  # 99.3% of legit traffic with the map off against 9.3% with it on, because a band placed at a
  # genuine probability of 0.005 catches nearly everything when the score is not a probability.
  # A one-shot warning fires if anything decides in cost mode without it.
  #
  # None of this can move PR-AUC, recall@FPR or precision@k — not because the map is monotone,
  # but because the calibrated probability never reaches `DetectorScore.score`. The monotonicity
  # argument was tried and it broke: the logistic rounds to exactly 1.0 in float64, and on
  # PaySim's test window it flattened the top 200 rows into one value. See decision.decide.
  calibration: sigmoid

  # null in cost mode, and `assert_one_operating_point` refuses anything else: the cost model
  # places the bands, so an FPR target would be a second operating point wearing one config. The
  # realised FPR is reported instead, as `false_decline_rate`, next to recall@1%FPR in the same
  # table. Set mode=threshold if an FPR target is what you actually want.
  calibrate_to_fpr: null
