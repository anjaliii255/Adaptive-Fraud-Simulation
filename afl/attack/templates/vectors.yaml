# The nine vectors. Declarative on purpose: adding a vector must never mean editing an engine.
#
# Four axes, and they answer four different questions. Flattening them is how a taxonomy stops
# being a model of the domain and becomes a list.
#
#   level     what kind of thing this is
#             mechanism    -> the fraud itself
#             enabler      -> what makes the fraud possible (social engineering, a fabricated
#                             identity); the loss lands elsewhere
#             model-attack -> an attack against our own detector
#
#   tier      its role in this build, not a judgement of severity
#             strong -> the adaptive optimiser wraps these; the closed loop runs here
#             common -> must-catch load: templates in training, and fixed benchmarks
#             mid    -> emerging / novelty: held out, or free by construction
#
#   maturity  how well-evidenced the family is in the real world, and therefore how much weight
#             its numbers can carry
#             mature   -> we believe the numbers
#             emerging -> plausible, thin evidence
#             research -> in the lab only; reported separately, never in the headline table
#
#   status    what this repo can actually generate TODAY. Nothing may assume otherwise.
#             built    -> the engines express this vector's defining behaviour
#             template -> schema-valid traffic of roughly the right shape, but the defining tell
#                         is not modelled yet. Fine as background fraud; NOT reportable as a
#                         family until its ticket lands. `gap` says exactly what is missing.
#             planned  -> cannot be generated at all. `Simulator.generate` raises and names the
#                         ticket, because a vector that silently produces nothing is worse than
#                         one that is honestly absent.
#
# `params` are the fixed defaults. `search_space` is what the optimiser is allowed to move, and
# the bounds are the realism envelope — outside them the batch stops looking like traffic.
# `actor_overrides` retunes the actor bundle for this vector only (a card-testing vector that
# settles on the UPI rail is not a card-testing vector).

vectors:
  # ── STRONG · the three that run the full adaptive loop ───────────────────────────
  S1:
    name: Mule network & layering
    engine: graph
    actor: mule
    level: mechanism
    tier: strong
    maturity: mature
    status: built
    why: >-
      The richest structure we have: network behaviour reveals fraud even when every single
      transaction looks legitimate. Fan-in to a collector, then layering hops before cash-out.
      Perfect substrate for graph features and for the adaptive loop, and directly relevant to
      India's mule-account crackdown.
    params: {motif: layering, n_sources: 8, n_hops: 2, split_ratio: 1.0, hold_time_s: 900, leak: 0.03}
    search_space:
      n_sources: {type: int, low: 3, high: 25}
      n_hops: {type: int, low: 1, high: 6}
      split_ratio: {type: float, low: 0.2, high: 1.0}
      hold_time_s: {type: float, low: 60, high: 86400, log: true}
      leak: {type: float, low: 0.0, high: 0.2}

  S2:
    name: Card testing / BIN enumeration
    engine: velocity
    actor: fraudster
    level: mechanism
    tier: strong
    maturity: mature
    status: built
    why: >-
      Automated validation of generated card numbers. Adaptation is visually legible here — the
      attacker walks from a loud burst to low-and-slow to randomised intervals to distribution
      across cards and merchants, straight around a static velocity threshold. Trivial to
      evaluate, and the cleanest live demonstration of the loop working.
    params: {n_txns: 40, burst_size: 40, burst_gap_s: 60, intra_burst_s: 3, threshold: null,
             device_rotation: 0.9, amount_jitter: 0.4}
    actor_overrides: {rails: [card]}
    search_space:
      n_txns: {type: int, low: 10, high: 120}
      burst_size: {type: int, low: 1, high: 40}
      burst_gap_s: {type: float, low: 60, high: 172800, log: true}
      intra_burst_s: {type: float, low: 1, high: 3600, log: true}
      device_rotation: {type: float, low: 0.0, high: 1.0}

  S3:
    name: Account takeover via drift
    engine: drift
    actor: fraudster
    level: mechanism
    tier: strong
    maturity: mature
    status: built
    why: >-
      Post-compromise behavioural change on a real account: new device, new beneficiary, changed
      velocity. `ramp` is the axis that matters — a sudden switch is easy, gradual drift with no
      event to anchor on is where per-row features run out and a sequence model has to earn its
      seat instead of decorating the deck.
    params: {n_baseline: 30, n_post: 12, ramp: 0.0, amount_shift: 6.0, new_device: true,
             dormancy_s: 3600}
    search_space:
      ramp: {type: float, low: 0.0, high: 1.0}
      amount_shift: {type: float, low: 1.2, high: 10.0}
      n_baseline: {type: int, low: 10, high: 60}
      n_post: {type: int, low: 3, high: 30}

  # ── COMMON · must-catch load, templates plus fixed benchmarks ────────────────────
  C1:
    name: Bust-out
    engine: drift
    actor: normal
    level: mechanism
    tier: common
    maturity: mature
    status: built
    why: >-
      Long clean tenure, then a sudden utilisation spike before cash-out. A dominant real-loss
      category and a pure sequence problem. It shares the drift engine with S3, so a whole extra
      family costs almost nothing to carry. Deliberately loud: this is must-catch commodity load,
      the exact inverse of M3, and a detector that misses it is not credible. Modelled one account
      at a time; a ring of accounts busting out together is S1's territory, not a second C1.
    params: {n_baseline: 60, n_post: 10, ramp: 0.2, amount_shift: 8.0, new_device: false,
             dormancy_s: 0, pace_factor: 6.0}
    search_space:
      n_baseline: {type: int, low: 30, high: 120}
      n_post: {type: int, low: 3, high: 20}
      amount_shift: {type: float, low: 3.0, high: 15.0}
      ramp: {type: float, low: 0.0, high: 0.6}          # low: the spike is an event, not a drift
      pace_factor: {type: float, low: 3.0, high: 10.0}  # utilisation accelerates into the drain

  C2:
    name: UPI collect-request / APP scam
    engine: velocity
    actor: normal
    level: enabler
    tier: common
    maturity: mature
    status: built
    why: >-
      The dominant India account-to-account scam class, and the one where the victim authorises
      the payment themselves — so there is no compromised credential to find. First-time-payee
      and rapid-drain features are cheap and high-signal, and it keeps the submission on-rail for
      a Mastercard / GFF audience. The victim's own device and account are used throughout;
      only the destination is hostile, and the payee is a mule the account has never paid.
    params: {n_txns: 3, burst_size: 3, burst_gap_s: 60, intra_burst_s: 150, threshold: null,
             device_rotation: 0.0, amount_jitter: 0.3, n_payees: 1, amount_shift: 5.0}
    actor_overrides: {rails: [upi]}
    search_space:
      n_txns: {type: int, low: 1, high: 8}
      intra_burst_s: {type: float, low: 30, high: 3600, log: true}
      amount_jitter: {type: float, low: 0.05, high: 0.5}
      amount_shift: {type: float, low: 2.0, high: 12.0}   # atypical for the payer, not for the rail

  C3:
    name: Instant-A2A pass-through
    engine: graph
    actor: mule
    level: mechanism
    tier: common
    maturity: mature
    status: built
    why: >-
      A new payee plus immediate onward drain, on rails with no chargeback. It exploits the exact
      irrevocability property that makes real-time payments hard to defend, and it reuses the
      graph and velocity primitives already built for S1 and S2. One relay hop only: the
      multi-hop version is S1, and the two must stay distinguishable. Cross-institution is the
      one part of the signature the contract cannot carry — there is no institution field, and
      adding one is a joint decision, so the relay is modelled without it.
    params: {motif: pass_through, n_sources: 3, n_hops: 1, split_ratio: 1.0, hold_time_s: 30,
             leak: 0.01, fresh_beneficiary: true}
    search_space:
      n_sources: {type: int, low: 1, high: 8}
      hold_time_s: {type: float, low: 5, high: 900, log: true}   # dwell stays a relay, not a hold
      leak: {type: float, low: 0.0, high: 0.05}

  # ── MID · emerging, novelty, and the holdout ─────────────────────────────────────
  M1:
    name: Boundary probing / paced evasion
    engine: velocity
    actor: mule
    level: model-attack
    tier: mid
    maturity: research
    status: template
    gap: >-
      Today it paces under a *static* reporting ceiling. The vector the architecture argues for
      paces under the detector's own learned boundary; that trajectory is the optimiser's search,
      surfaced as an artefact in ticket 13.
    why: >-
      Activity deliberately clustered just under known limits, with the attacker mapping the
      approve/decline boundary and walking along the safe side of it. It costs almost nothing to
      build because it *is* the adaptive optimiser's search strategy, and it is the cleanest
      attack-against-our-own-model in the taxonomy.
    params: {n_txns: 15, burst_size: 3, burst_gap_s: 21600, intra_burst_s: 600, threshold: 10000,
             device_rotation: 0.1, amount_jitter: 0.08}
    search_space:
      burst_size: {type: int, low: 1, high: 8}
      burst_gap_s: {type: float, low: 600, high: 172800, log: true}
      amount_jitter: {type: float, low: 0.01, high: 0.3}

  M2:
    name: Synthetic-identity lifecycle
    engine: drift
    actor: normal
    level: enabler
    tier: mid
    maturity: emerging
    status: built
    why: >-
      Identity fabrication, onboarding, seasoning, then payment abuse. It covers the onboarding
      surface and models fraud that begins *before* the first transaction, then hands off into
      the bust-out arc rather than needing an engine of its own. What separates it from C1 is the
      account, not the ending: C1 is a genuinely old account going bad, M2's was never real. The
      account is minted for the run, so it has no population history at all — a thin file that
      seasons fast and then busts out. Only the bust-out is labelled fraud; the seasoning is legit
      background, because the tell lives in the thinness and the speed, not in the label.
    params: {n_baseline: 25, n_post: 8, ramp: 0.1, amount_shift: 10.0, new_device: false,
             dormancy_s: 604800, new_account: true, pace_factor: 6.0}
    search_space:
      n_baseline: {type: int, low: 10, high: 60}
      n_post: {type: int, low: 2, high: 15}
      dormancy_s: {type: float, low: 86400, high: 15552000, log: true}
      pace_factor: {type: float, low: 3.0, high: 10.0}

  M3:
    name: First-party / friendly fraud
    engine: drift
    actor: normal
    level: mechanism
    tier: mid
    maturity: emerging
    status: built
    why: >-
      The legitimate owner abusing the product. `user == fraudster` breaks the legit-vs-attacker
      assumption every supervised feature quietly rests on: no compromised device, no new
      operator, no ring. That is exactly why it is the leave-one-attack-out holdout, why the
      anomaly layer exists at all, and the single biggest omission a domain judge would probe.
      Modelled behaviourally: a long genuine history, then sustained escalation on the account's
      own device to the account's own beneficiaries. The abuse is anomalous only against that
      account's baseline, never against the population. Chargeback and refund *events* are not
      represented because the contract has no product-event field; adding one is a joint decision.
    params: {n_baseline: 60, n_post: 25, ramp: 0.9, amount_shift: 2.0, new_device: false,
             dormancy_s: 0, beneficiary_reuse: 1.0, pace_factor: 0.6}
    search_space:
      ramp: {type: float, low: 0.6, high: 1.0}          # always gradual: no event to anchor on
      amount_shift: {type: float, low: 1.3, high: 3.0}  # drifts up, never the 6x of a takeover
      n_post: {type: int, low: 10, high: 60}
      beneficiary_reuse: {type: float, low: 0.85, high: 1.0}  # a new payee would be a ring tell
      pace_factor: {type: float, low: 0.0, high: 1.5}   # mild; a 5x burst is a velocity rule's gift
